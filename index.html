<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fed6e3 0%, #a8c1ef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Container Configuration */
        .card-container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.45);
            padding: 40px 60px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: cardAppear 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Typography Animations */
        h1 {
            font-size: 3.5rem;
            color: #ff4a7d;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            opacity: 0;
            animation: textPop 0.8s 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        p {
            font-size: 1.5rem;
            color: #4a6fa5;
            opacity: 0;
            animation: fadeIn 1s 1.2s ease forwards;
        }

        /* Pure CSS Birthday Cake */
        .cake {
            width: 150px;
            height: 100px;
            position: relative;
            margin: 30px auto;
        }

        .layer {
            position: absolute;
            display: block;
            border-radius: 10px 10px 0 0;
        }

        .layer-bottom {
            width: 150px;
            height: 40px;
            bottom: 0;
            background: #e3a857; /* Biscuit layer */
            border-bottom: 4px solid #b87d31;
        }

        .layer-top {
            width: 130px;
            height: 35px;
            bottom: 36px;
            left: 10px;
            background: #f1ebd9; /* Cream layer */
        }

        .icing {
            width: 130px;
            height: 12px;
            background: #ff4a7d;
            position: absolute;
            top: 29px;
            left: 10px;
            border-radius: 5px;
            z-index: 2;
        }

        .candle {
            background: #4ef0ff;
            width: 8px;
            height: 35px;
            position: absolute;
            top: -6px;
            left: 71px;
            border-radius: 4px;
        }

        .flame {
            position: absolute;
            background-color: #ff9d00;
            width: 12px;
            height: 18px;
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            top: -22px;
            left: -2px;
            animation: flicker 0.6s infinite alternate;
            box-shadow: 0 0 10px #ffea00;
        }

        /* Floating Balloons Setup */
        .balloon-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 65px;
            height: 75px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp 8s infinite linear;
        }

        .balloon::before {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 29px;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -35px;
            left: 32px;
            width: 2px;
            height: 30px;
            background-color: rgba(0, 0, 0, 0.15);
        }

        /* Varied Balloons */
        .b1 { left: 10%; background: #ff4a7d; animation-duration: 7s; }
        .b1::before { border-bottom: 6px solid #ff4a7d; }

        .b2 { left: 25%; background: #4ef0ff; animation-delay: 1.5s; animation-duration: 9s; }
        .b2::before { border-bottom: 6px solid #4ef0ff; }

        .b3 { left: 70%; background: #ffca4a; animation-delay: 0.5s; animation-duration: 8s; }
        .b3::before { border-bottom: 6px solid #ffca4a; }

        .b4 { left: 85%; background: #a55eed; animation-delay: 2.2s; animation-duration: 6.5s; }
        .b4::before { border-bottom: 6px solid #a55eed; }

        /* Keyframes */
        @keyframes cardAppear {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes textPop {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); background-color: #ff9d00; }
            100% { transform: scale(1.1) rotate(2deg); background-color: #ffea00; }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(10deg); opacity: 0; }
        }

        /* Scratch Card Styles */
        .scratch-section {
            margin-top: 25px;
            opacity: 0;
            animation: fadeIn 1s 1.8s ease forwards;
        }

        .scratch-label {
            font-size: 1.1rem;
            color: #4a6fa5;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .scratch-card {
            position: relative;
            width: 280px;
            height: 90px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            border: 3px solid #fff;
        }

        .scratch-reveal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff4e0 0%, #ffe0ec 100%);
            font-size: 1.8rem;
            letter-spacing: 4px;
            font-weight: bold;
            color: #ff4a7d;
            text-shadow: 1px 1px 0px #fff;
        }

        .scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        .scratch-hint {
            font-size: 0.85rem;
            color: #6a8fc5;
            margin-top: 10px;
            opacity: 0.8;
            transition: opacity 0.4s ease;
        }

        .scratch-hint.hidden {
            opacity: 0;
        }

        .reset-btn {
            margin-top: 14px;
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            background: #ff4a7d;
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            font-family: inherit;
        }

        .reset-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .reset-btn:hover {
            background: #ff2f68;
        }
    </style>
</head>
<body>

    <!-- Animated Backdrop Elements -->
    <div class="balloon-wrapper">
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>
    </div>

    <!-- Center Card Element -->
    <div class="card-container">
        <h1>Happy Birthday!</h1>

        <!-- Animated Cake Layout -->
        <div class="cake">
            <div class="candle"><div class="flame"></div></div>
            <div class="icing"></div>
            <div class="layer layer-top"></div>
            <div class="layer layer-bottom"></div>
        </div>

        <p>Wishing you a wonderful day filled with joy!</p>

        <!-- Scratch to Reveal Gift Code -->
        <div class="scratch-section">
            <div class="scratch-label">Scratch to open your gift 🎁</div>
            <div class="scratch-card" id="scratchCard">
                <div class="scratch-reveal">12345678</div>
                <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
            </div>
            <div class="scratch-hint" id="scratchHint">Use your finger or mouse to scratch</div>
            <button class="reset-btn" id="resetBtn">Scratch Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const scratchCard = document.getElementById('scratchCard');
        const scratchHint = document.getElementById('scratchHint');
        const resetBtn = document.getElementById('resetBtn');

        let isDrawing = false;
        let hasStartedScratching = false;

        function initScratchCard() {
            const rect = scratchCard.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            // Draw the scratchable foil layer
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#c0c0c0');
            gradient.addColorStop(0.5, '#e8e8e8');
            gradient.addColorStop(1, '#b8b8b8');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add some texture text
            ctx.fillStyle = 'rgba(150, 150, 150, 0.6)';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < 6; i++) {
                ctx.fillText('SCRATCH', (canvas.width / 6) * i + 40, canvas.height / 2 + (i % 2 === 0 ? -15 : 15));
            }

            canvas.style.opacity = '1';
            resetBtn.classList.remove('visible');
            scratchHint.classList.remove('hidden');
            hasStartedScratching = false;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function scratch(e) {
            e.preventDefault();
            const pos = getPos(e);

            if (!hasStartedScratching) {
                hasStartedScratching = true;
                scratchHint.classList.add('hidden');
            }

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 20, 0, Math.PI * 2);
            ctx.fill();

            checkRevealPercentage();
        }

        function checkRevealPercentage() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentCount = 0;
            const totalPixels = pixels.length / 4;

            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) transparentCount++;
            }

            const percentRevealed = (transparentCount / totalPixels) * 100;

            if (percentRevealed > 55) {
                // Fully clear the canvas for a clean reveal
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.style.transition = 'opacity 0.6s ease';
                canvas.style.opacity = '0';
                setTimeout(() => {
                    canvas.style.pointerEvents = 'none';
                }, 600);
                resetBtn.classList.add('visible');
            }
        }

        function startDrawing(e) {
            isDrawing = true;
            scratch(e);
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing) return;
            scratch(e);
        }

        // Mouse events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Touch events
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // Reset button
        resetBtn.addEventListener('click', () => {
            canvas.style.transition = 'none';
            canvas.style.pointerEvents = 'auto';
            initScratchCard();
        });

        // Initialize on load
        window.addEventListener('load', initScratchCard);
        window.addEventListener('resize', () => {
            if (canvas.style.opacity !== '0') {
                initScratchCard();
            }
        });
    </script>

</body>
</html>
